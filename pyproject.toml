[project]
name = "listam-mcp"
version = "0.1.0"
description = "MCP server for searching list.am, Armenia's largest classifieds site"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "list.am", "armenia", "classifieds", "claude"]
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
listam-mcp = "listam_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/listam_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"
